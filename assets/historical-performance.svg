e x1="290" y1="430" x2="322" y2="430" stroke="#397FC5" stroke-width="3"/><text x="333" y="435" font-size="15" fill="#526474" text-anchor="start" font-weight="400">Milk supply</text><line x1="530" y1="430" x2="562" y2="430" stroke="#8498AA" stroke-width="3"/><text x="573" y="435" font-size="15" fill="#526474" text-anchor="start" font-weight="400">Selected WMP exports</text><line x1="48" y1="785" x2="1152" y2="785" stroke="#E3EBF2" stroke-width="1"/><text x="48" y="825" font-size="23" fill="#397FC5" text-anchor="start" font-weight="400">Annual growth range, 2016-2025</text><text x="650" y="825" font-size="23" fill="#397FC5" text-anchor="start" font-weight="400">Recovery from 2022 to 2025</text><text x="48" y="862" font-size="15" fill="#526474" text-anchor="start" font-weight="400">Observed minimum and maximum YoY growth</text><text x="48" y="903" font-size="18" fill="#374958" text-anchor="start" font-weight="400">Milk supply</text><text x="540" y="903" font-size="19" fill="#397FC5" text-anchor="end" font-weight="400">-3.46% to +2.70%</text><line x1="48" y1="922" x2="540" y2="922" stroke="#E3EBF2" stroke-width="1"/><text x="48" y="953" font-size="18" fill="#374958" text-anchor="start" font-weight="400">WMP exports</text><text x="540" y="953" font-size="19" fill="#8498AA" text-anchor="end" font-weight="400">-18.71% to +10.87%</text><text x="48" y="988" font-size="15" fill="#526474" text-anchor="start" font-weight="400">Exports show a wider observed growth range.</text><line x1="595" y1="846" x2="595" y2="1000" stroke="#E3EBF2" stroke-width="1"/><text x="650" y="878" font-size="34" fill="#397FC5" text-anchor="start" font-weight="400">+7.05%</text><text x="800" y="878" font-size="18" fill="#526474" text-anchor="start" font-weight="400">Milk supply</text><text x="650" y="928" font-size="34" fill="#8498AA" text-anchor="start" font-weight="400">+0.64%</text><text x="800" y="928" font-size="18" fill="#526474" text-anchor="start" font-weight="400">WMP exports</text><text x="650" y="973" font-size="16" fill="#526474" text-anchor="start" font-weight="400">2025 exports were 18.19% below the 2021 peak.</text><line x1="48" y1="1027" x2="1152" y2="1027" stroke="#E3EBF2" stroke-width="1"/><text x="48" y="1066" font-size="24" fill="#397FC5" text-anchor="start" font-weight="400">Planning implication</text><text x="48" y="1100" font-size="18" fill="#374958" text-anchor="start" font-weight="400">Maintain separate supply and export assumptions. Review multi-year trends and use 2022</text><text x="48" y="1127" font-size="18" fill="#374958" text-anchor="start" font-weight="400">as a historical scenario for investigating large shipment deviations.</text><text x="48" y="1170" font-size="13" fill="#526474" text-anchor="start" font-weight="400">Sources: Stats NZ, HS10 0402210019 (CC BY 4.0); DCANZ / NZX / DairyNZ; workbook annual aggregates.</text><text x="48" y="1191" font-size="13" fill="#526474" text-anchor="start" font-weight="400">Descriptive comparison only. Indexed series are not a material balance, causal model or forecast.</text></g></svg>