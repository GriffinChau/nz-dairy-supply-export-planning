<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">Long-term supply and export divergence, 2015-2025</title><desc id="desc">Indexed annual milk and domestic WMP export volumes, growth range and recovery since 2022. Separate planning assumptions are recommended.</desc><rect x="0" y="0" width="1200" height="1220" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><line x1="48" y1="38" x2="118" y2="38" stroke="#71A9DF" stroke-width="3"/><text x="48" y="86" font-size="34" fill="#397FC5" text-anchor="start" font-weight="400">Long-term supply &amp; export divergence</text><text x="48" y="117" font-size="17" fill="#526474" text-anchor="start" font-weight="400">New Zealand dairy sector | Calendar years 2015-2025</text><line x1="48" y1="155" x2="1152" y2="155" stroke="#E3EBF2" stroke-width="1"/><text x="48" y="187" font-size="19" fill="#526474" text-anchor="start" font-weight="400">2015 to 2025</text><text x="48" y="241" font-size="46" fill="#397FC5" text-anchor="start" font-weight="400">+6.13%</text><text x="48" y="271" font-size="18" fill="#526474" text-anchor="start" font-weight="400">National milk supply</text><text x="48" y="296" font-size="15" fill="#526474" text-anchor="start" font-weight="400">1,861.58 to 1,975.74 million kg milk solids</text><line x1="595" y1="180" x2="595" y2="300" stroke="#E3EBF2" stroke-width="1"/><text x="650" y="241" font-size="46" fill="#8498AA" text-anchor="start" font-weight="400">-4.39%</text><text x="650" y="271" font-size="18" fill="#526474" text-anchor="start" font-weight="400">Selected domestic WMP exports</text><text x="650" y="296" font-size="15" fill="#526474" text-anchor="start" font-weight="400">1,364.76 to 1,304.78 million kg powder</text><line x1="48" y1="330" x2="1152" y2="330" stroke="#E3EBF2" stroke-width="1"/><text x="48" y="370" font-size="25" fill="#397FC5" text-anchor="start" font-weight="400">Relative annual performance</text><text x="48" y="397" font-size="16" fill="#526474" text-anchor="start" font-weight="400">Index: 2015 = 100. Each series is indexed to its own 2015 volume.</text><line x1="100" y1="715" x2="1064" y2="715" stroke="#E3EBF2" stroke-width="1"/><text x="86" y="720" font-size="14" fill="#526474" text-anchor="end" font-weight="400">90</text><line x1="100" y1="670.8333333333334" x2="1064" y2="670.8333333333334" stroke="#E3EBF2" stroke-width="1"/><text x="86" y="675.8333333333334" font-size="14" fill="#526474" text-anchor="end" font-weight="400">95</text><line x1="100" y1="626.6666666666666" x2="1064" y2="626.6666666666666" stroke="#A9BACC" stroke-width="1.4" stroke-dasharray="5 4"/><text x="86" y="631.6666666666666" font-size="14" fill="#526474" text-anchor="end" font-weight="400">100</text><line x1="100" y1="582.5" x2="1064" y2="582.5" stroke="#E3EBF2" stroke-width="1"/><text x="86" y="587.5" font-size="14" fill="#526474" text-anchor="end" font-weight="400">105</text><line x1="100" y1="538.3333333333334" x2="1064" y2="538.3333333333334" stroke="#E3EBF2" stroke-width="1"/><text x="86" y="543.3333333333334" font-size="14" fill="#526474" text-anchor="end" font-weight="400">110</text><line x1="100" y1="494.1666666666667" x2="1064" y2="494.1666666666667" stroke="#E3EBF2" stroke-width="1"/><text x="86" y="499.1666666666667" font-size="14" fill="#526474" text-anchor="end" font-weight="400">115</text><line x1="100" y1="450" x2="1064" y2="450" stroke="#E3EBF2" stroke-width="1"/><text x="86" y="455" font-size="14" fill="#526474" text-anchor="end" font-weight="400">120</text><text x="100" y="741" font-size="14" fill="#526474" text-anchor="middle" font-weight="400">2015</text><text x="196.4" y="741" font-size="14" fill="#526474" text-anchor="middle" font-weight="400">2016</text><text x="292.8" y="741" font-size="14" fill="#526474" text-anchor="middle" font-weight="400">2017</text><text x="389.2" y="741" font-size="14" fill="#526474" text-anchor="middle" font-weight="400">2018</text><t