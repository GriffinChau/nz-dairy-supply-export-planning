<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>NZ dairy export planning | key findings</title><desc>Summary of 2025 export variance and historical forecast accuracy. Monthly export decreases are concentrated in May and November. Seasonal forecast error is lower than the latest-available-month baseline.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="116" rx="0" fill="#20354D"/><text x="42" y="39" font-size="15" fill="#BBDAD7" font-weight="700" text-anchor="start">NZ DAIRY | SUPPLY &amp; EXPORT PLANNING</text><text x="42" y="78" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="start">From seasonal patterns to planning decisions</text><text x="42" y="103" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">Independent Excel case study | 132 matched months | 2015-2025</text><rect x="42" y="135" width="270" height="112" rx="6" fill="#EDF3F3"/><text x="57" y="162" font-size="15" fill="#637180" font-weight="700" text-anchor="start">2025 WMP exports</text><text x="57" y="199" font-size="30" fill="#20354D" font-weight="700" text-anchor="start">1,304.8M kg</text><text x="57" y="226" font-size="14" fill="#637180" font-weight="400" text-anchor="start">-2.86% vs 2024</text><rect x="324" y="135" width="270" height="112" rx="6" fill="#EDF3F3"/><text x="339" y="162" font-size="15" fill="#637180" font-weight="700" text-anchor="start">Net annual change</text><text x="339" y="199" font-size="30" fill="#20354D" font-weight="700" text-anchor="start">-38.4M kg</text><text x="339" y="226" font-size="14" fill="#637180" font-weight="400" text-anchor="start">Domestic export volume</text><rect x="606" y="135" width="270" height="112" rx="6" fill="#EDF3F3"/><text x="621" y="162" font-size="15" fill="#637180" font-weight="700" text-anchor="start">May + November</text><text x="621" y="199" font-size="30" fill="#20354D" font-weight="700" text-anchor="start">67.08%</text><text x="621" y="226" font-size="14" fill="#637180" font-weight="400" text-anchor="start">Share of gross declines</text><rect x="888" y="135" width="270" height="112" rx="6" fill="#EDF3F3"/><text x="903" y="162" font-size="15" fill="#637180" font-weight="700" text-anchor="start">Seasonal forecast</text><text x="903" y="199" font-size="30" fill="#20354D" font-weight="700" text-anchor="start">12.42%</text><text x="903" y="226" font-size="14" fill="#637180" font-weight="400" text-anchor="start">2024-2025 one-month WAPE</text><text x="42" y="283" font-size="22" fill="#20354D" font-weight="700" text-anchor="start">Where did the 2025 export decline come from?</text><text x="42" y="309" font-size="15" fill="#637180" font-weight="400" text-anchor="start">Monthly domestic WMP volume change | million kg vs 2024</text><line x1="78" y1="569" x2="724" y2="569" stroke="#E7EBEF" stroke-width="1"/><text x="68" y="574" font-size="12" fill="#637180" font-weight="400" text-anchor="end">-30</text><line x1="78" y1="510" x2="724" y2="510" stroke="#E7EBEF" stroke-width="1"/><text x="68" y="515" font-size="12" fill="#637180" font-weight="400" text-anchor="end">-20</text><line x1="78" y1="451" x2="724" y2="451" stroke="#E7EBEF" stroke-width="1"/><text x="68" y="456" font-size="12" fill="#637180" font-weight="400" text-anchor="end">-10</text><line x1="78" y1="392" x2="724" y2="392" stroke="#637180" stroke-width="1.4"/><text x="68" y="397" font-size="12" fill="#637180" font-weight="400" text-anchor="end">0</text><line x1="78" y1="333" x2="724" y2="333" stroke="#E7EBEF" stroke-width="1"/><text x="68" y="338" font-size="12" fill="#637180" font-weight="400" text-anchor="end">10</text><rect x="91" y="364.4159424" width="35" height="27.584057599999994" rx="2" fill="#387D7A"/><text x="108.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Jan</text><rect x="143" y="392" width="35" height="83.50980949999995" rx="2" fill="#A8B5BC"/><text x="160.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Feb</text><rect x="195" y="392" width="35" height="52.79101699999994" rx="2" fill="#A8B5BC"/><text x="212.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Mar</text><rect x="247" y="392" width="35" height="14.649794400000038" rx="2" fill="#A8B5BC"/><text x="264.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Apr</text><rect x="299" y="392" width="35" height="164.37981739999998" rx="2" fill="#B26C45"/><text x="316.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">May</text><text x="316.5" y="571.3798174" font-size="12" fill="#20354D" font-weight="700" text-anchor="middle">-27.9</text><rect x="351" y="374.4793895" width="35" height="17.52061049999999" rx="2" fill="#387D7A"/><text x="368.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Jun</text><rect x="403" y="364.45534849999996" width="35" height="27.544651500000043" rx="2" fill="#387D7A"/><text x="420.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Jul</text><rect x="455" y="327.52777359999993" width="35" height="64.47222640000004" rx="2" fill="#387D7A"/><text x="472.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Aug</text><rect x="507" y="352.0689947000001" width="35" height="39.93100529999995" rx="2" fill="#387D7A"/><text x="524.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Sep</text><rect x="559" y="371.5895164" width="35" height="20.41048360000004" rx="2" fill="#387D7A"/><text x="576.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Oct</text><rect x="611" y="392" width="35" height="143.19006769999993" rx="2" fill="#B26C45"/><text x="628.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Nov</text><text x="628.5" y="550.1900676999999" font-size="12" fill="#20354D" font-weight="700" text-anchor="middle">-24.3</text><rect x="663" y="357.66247200000004" width="35" height="34.33752799999998" rx="2" fill="#387D7A"/><text x="680.5" y="587" font-size="12" fill="#637180" font-weight="400" text-anchor="middle">Dec</text><text x="760" y="283" font-size="22" fill="#20354D" font-weight="700" text-anchor="start">Forecast accuracy</text><text x="760" y="309" font-size="15" fill="#637180" font-weight="400" text-anchor="start">Domestic WMP | one-month test</text><text x="760" y="353" font-size="15" fill="#20354D" font-weight="700" text-anchor="start">Latest available month</text><rect x="760" y="365" width="340" height="26" rx="3" fill="#E7EBEF"/><rect x="760" y="365" width="297.84" height="26" rx="3" fill="#637180"/><text x="1124" y="384" font-size="17" fill="#20354D" font-weight="700" text-anchor="end">30.66%</text><text x="760" y="430" font-size="15" fill="#20354D" font-weight="700" text-anchor="start">Same month last year</text><rect x="760" y="442" width="340" height="26" rx="3" fill="#E7EBEF"/><rect x="760" y="442" width="120.65142857142858" height="26" rx="3" fill="#387D7A"/><text x="1124" y="461" font-size="17" fill="#20354D" font-weight="700" text-anchor="end">12.42%</text><text x="760" y="505" font-size="15" fill="#20354D" font-weight="700" text-anchor="start">2026 check (Jan-Jul)</text><text x="760" y="532" font-size="19" fill="#20354D" font-weight="700" text-anchor="start">13.02% WAPE | -10.13% bias</text><text x="760" y="556" font-size="14" fill="#637180" font-weight="400" text-anchor="start">Underforecasting merits monitoring.</text><rect x="42" y="610" width="1116" height="112" rx="6" fill="#20354D"/><text x="64" y="640" font-size="14" fill="#BBDAD7" font-weight="700" text-anchor="start">PLANNING RECOMMENDATION</text><text x="64" y="668" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="start">Keep the seasonal baseline. Investigate material shipment deviations before overrides.</text><text x="64" y="697" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">May and November account for 67.08% of gross declines, not the share of net change.</text><text x="42" y="754" font-size="13" fill="#637180" font-weight="400" text-anchor="start">Source: Stats NZ, HS10 0402210019 (CC BY 4.0); case study retrospective model evaluation.</text><text x="42" y="775" font-size="13" fill="#637180" font-weight="400" text-anchor="start">WAPE = weighted absolute percentage error. Exports are shipments, not customer demand.</text></g></svg>