eight="400">-10.13% signed bias (Jan-Jul)</text><line x1="48" y1="1000" x2="1152" y2="1000" stroke="#E3EBF2" stroke-width="1"/><text x="48" y="1036" font-size="23" fill="#397FC5" text-anchor="start" font-weight="400">Planning recommendation</text><text x="48" y="1067" font-size="18" fill="#374958" text-anchor="start" font-weight="400">Retain the seasonal baseline; investigate material shipment deviations before overrides.</text><text x="48" y="1093" font-size="15" fill="#526474" text-anchor="start" font-weight="400">May and November explain 67.08% of gross declines, not the net annual change.</text><text x="48" y="1132" font-size="13" fill="#526474" text-anchor="start" font-weight="400">Sources: Stats NZ (HS10 0402210019, CC BY 4.0); DCANZ / NZX / DairyNZ; retrospective case study.</text><text x="48" y="1152" font-size="13" fill="#526474" text-anchor="start" font-weight="400">WAPE = weighted absolute percentage error. Exports are shipments, not customer demand.</text></g></svg>