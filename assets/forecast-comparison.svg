<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img"><title>Export forecast accuracy</title><desc>Test WAPE for seasonal, export only and supply informed models at one to three months.</desc><rect width="960" height="370" fill="#FFFFFF"/><g font-family="Arial, sans-serif" fill="#20354D"><text x="36" y="39" font-size="24" font-weight="bold">Adding milk supply did not improve export forecasts</text><text x="36" y="64" font-size="14" fill="#637180">2024-2025 test | WAPE (%) | lower is better</text><line x1="75" x2="925" y1="285" y2="285" stroke="#E7EBEF"/><text x="61" y="289" text-anchor="end" font-size="12" fill="#637180">0%</text><line x1="75" x2="925" y1="225" y2="225" stroke="#E7EBEF"/><text x="61" y="229" text-anchor="end" font-size="12" fill="#637180">5%</text><line x1="75" x2="925" y1="165" y2="165" stroke="#E7EBEF"/><text x="61" y="169" text-anchor="end" font-size="12" fill="#637180">10%</text><line x1="75" x2="925" y1="105" y2="105" stroke="#E7EBEF"/><text x="61" y="109" text-anchor="end" font-size="12" fill="#637180">15%</text><rect x="135" y="135.96" width="55" height="149.04" rx="2" fill="#387D7A"/><text x="162.5" y="127.96000000000001" text-anchor="middle" font-size="12">12.42</text><rect x="200" y="132.84" width="55" height="152.16" rx="2" fill="#637180"/><text x="227.5" y="124.84" text-anchor="middle" font-size="12">12.68</text><rect x="265" y="124.07999999999998" width="55" height="160.92000000000002" rx="2" fill="#20354D"/><text x="292.5" y="116.07999999999998" text-anchor="middle" font-size="12">13.41</text><text x="227" y="305" text-anchor="middle" font-size="13">1 month</text><rect x="405" y="139.2" width="55" height="145.8" rx="2" fill="#387D7A"/><text x="432.5" y="131.2" text-anchor="middle" font-size="12">12.15</text><rect x="470" y="142.8" width="55" height="142.2" rx="2" fill="#637180"/><text x="497.5" y="134.8" text-anchor="middle" font-size="12">11.85</text><rect x="535" y="135" width="55" height="150" rx="2" fill="#20354D"/><text x="562.5" y="127" text-anchor="middle" font-size="12">12.50</text><text x="497" y="305" text-anchor="middle" font-size="13">2 months</text><rect x="675" y="157.44" width="55" height="127.56" rx="2" fill="#387D7A"/><text x="702.5" y="149.44" text-anchor="middle" font-size="12">10.63</text><rect x="740" y="157.07999999999998" width="55" height="127.92" rx="2" fill="#637180"/><text x="767.5" y="149.07999999999998" text-anchor="middle" font-size="12">10.66</text><rect x="805" y="143.64000000000001" width="55" height="141.35999999999999" rx="2" fill="#20354D"/><text x="832.5" y="135.64000000000001" text-anchor="middle" font-size="12">11.78</text><text x="767" y="305" text-anchor="middle" font-size="13">3 months</text><rect x="140" y="326" width="13" height="13" fill="#387D7A"/><text x="161" y="337" font-size="13">Seasonal baseline</text><rect x="395" y="326" width="13" height="13" fill="#637180"/><text x="416" y="337" font-size="13">Export only</text><rect x="650" y="326" width="13" height="13" fill="#20354D"/><text x="671" y="337" font-size="13">Supply informed</text><text x="36" y="359" font-size="11" fill="#637180">Source: retrospective model evaluation on revised public data. Target counts: 24, 23 and 22.</text></g></svg>