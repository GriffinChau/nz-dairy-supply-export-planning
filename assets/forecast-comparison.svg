igned bias</text><text x="63" y="982" font-size="17" fill="#374958" text-anchor="start" font-weight="400">Milk supply, Jan-May 2026</text><text x="790" y="982" font-size="17" fill="#526474" text-anchor="end" font-weight="400">5</text><text x="968" y="982" font-size="17" fill="#374958" text-anchor="end" font-weight="400">5.92%</text><text x="1137" y="982" font-size="17" fill="#397FC5" text-anchor="end" font-weight="400">-5.92%</text><line x1="48" y1="996" x2="1152" y2="996" stroke="#E3EBF2" stroke-width="1"/><text x="63" y="1026" font-size="17" fill="#374958" text-anchor="start" font-weight="400">Domestic WMP exports, Jan-Jul 2026</text><text x="790" y="1026" font-size="17" fill="#526474" text-anchor="end" font-weight="400">7</text><text x="968" y="1026" font-size="17" fill="#374958" text-anchor="end" font-weight="400">13.02%</text><text x="1137" y="1026" font-size="17" fill="#397FC5" text-anchor="end" font-weight="400">-10.13%</text><line x1="48" y1="1040" x2="1152" y2="1040" stroke="#E3EBF2" stroke-width="1"/><text x="48" y="1080" font-size="18" fill="#397FC5" text-anchor="start" font-weight="400">Adding milk supply did not improve the comparable export-only model at any horizon.</text><text x="48" y="1110" font-size="13" fill="#526474" text-anchor="start" font-weight="400">Source: retrospective evaluation on revised public observations. The threshold is a proposed review rule.</text></g></svg>